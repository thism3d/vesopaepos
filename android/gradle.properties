org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Pull in Dojo's native card SDK. The Dojo SDK (tech.dojo.pay:sdk/uisdk) is on
# Maven Central, but its 3-D Secure dependency (cardinalmobilesdk) lives in a
# credentialed Cardinal repo — supply cardinalRepoUsername / cardinalRepoPassword
# in ~/.gradle/gradle.properties (issued by Dojo on partner onboarding) for a
# full build. Enabled so the native drop-in is actually compiled and used.
dojo.sdk.enabled=true
