# Builds the Windows till, so releasing does not depend on anyone having a
# Windows machine set up to build it.
#
# Produces two artefacts on every run:
#   * vesopa-epos-windows      — the plain runner folder, copy-and-run
#   * vesopa-epos-msix         — an MSIX package for Store submission / sideload
#
# Tagging a release (v1.2.3) also attaches both to the GitHub release.
name: Build Windows till

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version this project is developed against, so CI does
          # not start failing the day Flutter ships a breaking stable. Written
          # literally rather than through `env:`, which is not reliably
          # available to `with:` at step level.
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      # Fail fast on analysis before spending time on the native build.
      - name: Analyse
        run: flutter analyze lib

      # `live`-tagged tests call Dojo's real sandbox; they need a key and a
      # reader, so they are for a developer to run deliberately, not for CI.
      - name: Test
        run: flutter test --exclude-tags live

      # The Dojo key is injected at build time and never committed — this
      # repository is public. Set DOJO_API_KEY under
      # Settings → Secrets and variables → Actions. With no secret the till
      # simply starts unconfigured and a key can be entered in Settings.
      - name: Build Windows release
        run: >
          flutter build windows --release
          --dart-define=DOJO_API_KEY=${{ secrets.DOJO_API_KEY }}

      - name: Package runner folder
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          if (!(Test-Path $out)) { throw "Build output not found at $out" }
          Compress-Archive -Path "$out/*" -DestinationPath vesopa-epos-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: vesopa-epos-windows
          path: vesopa-epos-windows.zip
          if-no-files-found: error

      # MSIX for the Microsoft Store. Built unsigned: Microsoft re-signs Store
      # submissions themselves, and no certificate is committed to this repo.
      # For a *sideloadable* signed package, add a base64 .pfx as the
      # CERTIFICATE_BASE64 secret and its password as CERTIFICATE_PASSWORD —
      # the step below then signs it.
      # `secrets` cannot be used in an `if:` expression, so the presence check
      # happens inside the script instead.
      - name: Restore signing certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) {
            Write-Host "No signing certificate configured — building unsigned for the Store."
          } else {
            [IO.File]::WriteAllBytes(
              "windows/certificate.pfx",
              [Convert]::FromBase64String($env:CERTIFICATE_BASE64)
            )
          }

      - name: Build MSIX
        shell: pwsh
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          if (Test-Path "windows/certificate.pfx") {
            # A certificate is present: produce a signed, sideloadable package
            # instead of a Store-signed one.
            dart run msix:create `
              --certificate-path windows/certificate.pfx `
              --certificate-password $env:CERTIFICATE_PASSWORD
          } else {
            # --store omits signing; Microsoft signs the package on submission.
            dart run msix:create --store
          }

      - uses: actions/upload-artifact@v4
        with:
          name: vesopa-epos-msix
          path: build/windows/x64/runner/Release/*.msix
          if-no-files-found: error

      # Tagged builds also become a GitHub release, so a specific till version
      # can be re-downloaded later rather than only living in a CI run.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vesopa-epos-windows.zip
            build/windows/x64/runner/Release/*.msix
